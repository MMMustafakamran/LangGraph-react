name: Record doc-page clips

# Records demo clips for LangGraph JS (React) doc pages on GitHub runners.
# Each shard is its own runner with its own LangGraph agent server (:8050) and Next dev
# server (:3050), so shards don't compete for memory the way local parallel runs did.
# Clips come back as run artifacts (one per shard); they are never committed.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Recorder page ids, comma-separated (split across 3 shards)'
        required: true
        type: string
        default: 'a2ui-fixed,components-catalogs,components-surfaces,components-theming,hashbrown,state-rendering,components-standard-catalog,components-from-a2ui,components-state-actions,components-markdown-mode,rendering-in-app,in-app-read,agent-readonly,workflow-execution,readables-prebuilt,multimodal,subgraphs,configurable,guardrails'
      a2ui_styling:
        description: 'Also record A2UI Styling in its own shard (its doc CSS breaks every route while mounted)'
        type: boolean
        default: true

concurrency:
  group: record-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, styling]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGGRAPH_DEPLOYMENT_URL: http://localhost:8050
      FRONTEND_URL: http://localhost:3050
      BACKEND_URL: http://localhost:8050
    steps:
      - name: Pick this shard's pages
        id: sel
        env:
          PAGES: ${{ inputs.pages }}
          SHARD: ${{ matrix.shard }}
          STYLING: ${{ inputs.a2ui_styling }}
        run: |
          set -euo pipefail
          if [ "$SHARD" = "styling" ]; then
            [ "$STYLING" = "true" ] && echo "pages=a2ui-styling" >> "$GITHUB_OUTPUT" || echo "pages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=',' read -ra ALL <<< "$PAGES"
          MINE=()
          for i in "${!ALL[@]}"; do
            p="$(echo "${ALL[$i]}" | xargs)"
            [ -n "$p" ] && [ $(( i % 3 + 1 )) -eq "$SHARD" ] && MINE+=("$p")
          done
          echo "pages=$(IFS=,; echo "${MINE[*]:-}")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.sel.outputs.pages != ''

      - uses: actions/setup-node@v4
        if: steps.sel.outputs.pages != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            frontend/package-lock.json
            autorecorder/package-lock.json

      - name: Install dependencies
        if: steps.sel.outputs.pages != ''
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npm ci --prefix agent --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix autorecorder --no-audit --no-fund
          # apt mirrors sometimes stall on runners: fail fast and retry instead of hanging.
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99net-timeouts > /dev/null
          # --with-deps installs xvfb and the browser libraries; Playwright ships its own ffmpeg.
          for i in 1 2 3; do
            (cd autorecorder && timeout 300 npx playwright install --with-deps chromium) && break
            echo "playwright install attempt $i failed or stalled; retrying"; sleep 10
          done
          # The deps step above can time out after the system packages but before the browser
          # download finishes; make sure the Chromium build itself is there.
          for i in 1 2 3; do
            (cd autorecorder && timeout 300 npx playwright install chromium) && break
            echo "chromium download attempt $i failed; retrying"; sleep 10
          done
          (cd autorecorder && node -e "const {chromium}=require('playwright'); require('fs').accessSync(chromium.executablePath()); console.log('chromium ok:', chromium.executablePath())")
          command -v xvfb-run

      - name: Write env files (secret from repo settings, never logged)
        if: steps.sel.outputs.pages != ''
        run: |
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" > agent/.env
          printf 'LANGGRAPH_DEPLOYMENT_URL=http://localhost:8050\n' > frontend/.env.local

      - name: Mount the A2UI Styling dark-mode route (styling shard only)
        if: matrix.shard == 'styling' && steps.sel.outputs.pages != ''
        run: mv frontend/app/generative-ui/a2ui/styling/_dark frontend/app/generative-ui/a2ui/styling/dark

      - name: Start agent server and frontend
        if: steps.sel.outputs.pages != ''
        run: |
          set -euo pipefail
          mkdir -p logs
          (cd agent && nohup npx --yes @langchain/langgraph-cli dev --port 8050 --no-browser > ../logs/agent.log 2>&1 &)
          (cd frontend && nohup npm run dev > ../logs/frontend.log 2>&1 &)
          for i in $(seq 1 120); do curl -sf http://localhost:8050/ok >/dev/null && break; sleep 5; done
          curl -sf http://localhost:8050/ok || { tail -50 logs/agent.log; exit 1; }
          for i in $(seq 1 120); do curl -s -o /dev/null http://localhost:3050/ && break; sleep 5; done
          echo "agent graphs: $(curl -s -X POST http://localhost:8050/assistants/search -H 'content-type: application/json' -d '{"limit":100}' | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')"
          # Warm the graph schemas so the first take doesn't hit the schema-extract timeout.
          for g in $(curl -s -X POST http://localhost:8050/assistants/search -H 'content-type: application/json' -d '{"limit":100}' | python3 -c 'import sys,json; print(" ".join(a["assistant_id"] for a in json.load(sys.stdin)))'); do
            curl -s -m 240 -o /dev/null "http://localhost:8050/assistants/$g/schemas" || true
          done

      - name: Record
        if: steps.sel.outputs.pages != ''
        run: |
          cd autorecorder
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            npm run record -- --pages=${{ steps.sel.outputs.pages }} 2>&1 | tee ../logs/record.log
          sed -n '/RECORDING SUITE SUMMARY/,$p' ../logs/record.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload clips and logs
        if: always() && steps.sel.outputs.pages != ''
        uses: actions/upload-artifact@v4
        with:
          name: clips-shard-${{ matrix.shard }}
          path: |
            autorecorder/videos/*.webm
            autorecorder/videos/*.timeline.json
            autorecorder/videos/RECORD_RESULTS.json
            autorecorder/videos/logs/
            logs/
          if-no-files-found: ignore
          retention-days: 14
